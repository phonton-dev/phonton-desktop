name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check pinned engine and release state
    runs-on: ubuntu-latest
    outputs:
      engine_sha: ${{ steps.engine.outputs.sha }}
      engine_version: ${{ steps.engine.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout tagged Desktop source
        uses: actions/checkout@v4

      - name: Check tag matches every package version
        id: metadata
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$(node -p 'require("./package.json").version')"
          fi
          node scripts/release-metadata.mjs "$tag"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read pinned CLI source
        id: engine
        shell: bash
        run: |
          sha=$(jq -r '.commit' engine-source.json)
          version=$(jq -r '.version' engine-source.json)
          repository=$(jq -r '.repository' engine-source.json)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9.-]+)?$ ]] ||
             [ "$repository" != 'phonton-dev/phonton-cli' ]; then
            echo '::error::Tag source must pin a public CLI commit and engine version in engine-source.json.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse an existing release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Unsupported release tag.'
            exit 1
          fi
          status=$(curl --silent --show-error --output release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          if [ "$status" = 200 ]; then
            echo '::error::This tag already has a release, including drafts; refusing to reuse its assets.'
            exit 1
          elif [ "$status" != 404 ]; then
            echo "::error::Could not verify release state (HTTP $status)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Windows engine source
        if: matrix.platform == 'windows-latest'
        uses: actions/checkout@v4
        with:
          repository: phonton-dev/phonton-cli
          ref: ${{ needs.preflight.outputs.engine_sha }}
          path: phonton-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check desktop contracts
        run: node --test scripts/*.test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/${{ needs.preflight.outputs.release_tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo 'body<<EOF'
              cat "$NOTES_FILE"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=Automated Phonton Desktop release." >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PHONTON_ENGINE_SOURCE_DIR: ${{ github.workspace }}/phonton-dev
          PHONTON_ENGINE_EXPECTED_VERSION: ${{ needs.preflight.outputs.engine_version }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Phonton Desktop ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          includeUpdaterJson: ${{ needs.preflight.outputs.prerelease != 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked

      - name: Build release candidate without publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PHONTON_ENGINE_SOURCE_DIR: ${{ github.workspace }}/phonton-dev
          PHONTON_ENGINE_EXPECTED_VERSION: ${{ needs.preflight.outputs.engine_version }}
        run: npx tauri build ${{ matrix.args }} -- --locked

      - name: Record exact Windows release candidate
        if: matrix.platform == 'windows-latest'
        env:
          PHONTON_ACCEPTANCE_KIND: release
          PHONTON_ENGINE_SOURCE_DIR: ${{ github.workspace }}/phonton-dev
        run: node scripts/windows-acceptance/package-candidate.mjs

      - name: Retain Windows candidate for installed acceptance
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: acceptance-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Retain platform candidate bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  installed-windows:
    name: Accept the installed Windows NSIS release candidate
    needs: build
    runs-on: windows-2022
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      PHONTON_ACCEPTANCE_KIND: release
      PHONTON_ACCEPTANCE_FULL_JOURNEY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          path: acceptance-candidate
      - name: Install WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Match EdgeDriver to installed WebView2
        run: ./scripts/windows-acceptance/prepare-driver.ps1
      - name: Install and test exact release bytes
        run: ./scripts/windows-acceptance/run.ps1
      - name: Retain installed acceptance evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-native-evidence
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7

  checksums:
    name: Add checksums to draft
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          path: acceptance-candidate

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --pattern '*.dmg' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.tar.gz' \
            --pattern '*.sig' \
            --pattern '*.json'

      - name: Match draft installer to installed acceptance candidate
        run: node scripts/windows-acceptance/candidate-profile.mjs acceptance-candidate/candidate.json release "$GITHUB_SHA" dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.AppImage *.deb *.tar.gz)
          windows=(*.exe *.msi)
          macos=(*.dmg)
          linux=(*.AppImage *.deb)
          if [ ${#windows[@]} -eq 0 ] || [ ${#macos[@]} -eq 0 ] || [ ${#linux[@]} -eq 0 ]; then
            echo 'Missing installer assets for one or more required platforms.' >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS.txt --clobber

  publish:
    name: Publish complete release
    needs: [build, checksums, installed-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
