name: Accept native Windows folder picker

on:
  workflow_dispatch:
  push:
    branches: ['2ntt/native-picker-20261006']
    paths:
      - '.github/workflows/windows-native-picker.yml'
      - 'scripts/windows-acceptance/**'
      - 'scripts/windows-native-picker.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-native-picker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Native folder selection and settled runtime status
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Validate picker and retention contracts
        run: node --test scripts/windows-native-picker.test.mjs scripts/windows-upgrade.test.mjs
      - name: Verify pinned candidate artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force acceptance-evidence | Out-Null
          $source = Get-Content scripts/windows-acceptance/picker-source.json -Raw | ConvertFrom-Json
          $repo = $source.repository
          if ($repo -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected repository' }
          $run = gh api "repos/$repo/actions/runs/$($source.candidate.runId)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $source.candidate.commit -or $run.conclusion -ne 'success') { throw 'Candidate build run is not accepted' }
          $artifact = gh api "repos/$repo/actions/artifacts/$($source.candidate.artifactId)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or $artifact.workflow_run.id -ne $source.candidate.runId -or $artifact.name -ne $source.candidate.artifactName -or $artifact.digest -ne "sha256:$($source.candidate.artifactSha256)") { throw 'Candidate artifact identity mismatch' }
          $run | ConvertTo-Json -Depth 15 | Set-Content acceptance-evidence/candidate-build-run.json
          $artifact | ConvertTo-Json -Depth 8 | Set-Content acceptance-evidence/candidate-artifact.json
          "run_id=$($source.candidate.runId)" >> $env:GITHUB_OUTPUT
          "artifact_id=$($source.candidate.artifactId)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: acceptance-candidate
      - name: Install WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Match EdgeDriver to installed WebView2
        run: ./scripts/windows-acceptance/prepare-driver.ps1
      - name: Select repository through native dialog and run full journey
        run: ./scripts/windows-acceptance/run-picker.ps1
      - name: Retain native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-picker-evidence
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7
